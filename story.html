<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>肺肺王國的故事</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <main class="story-page">

        <div class="story-card">

            <div class="story-character">
                🫁
            </div>


            <h1>
                歡迎來到<br>
                肺肺王國！
            </h1>


            <p class="story-text">

                這是一個充滿陽光與健康的地方。

                <br><br>

                每一個人的身體裡，
                都住著兩個努力工作的肺肺。

                <br><br>

                可是有一天……

            </p>


            <div class="monster">
                👾
            </div>


            <p class="story-text">

                一個神秘的「結核怪獸」
                出現在肺肺王國！

                <br><br>

                肺肺超人需要你的幫忙！

            </p>


            <button
                class="start-button"
                onclick="goToCharacter()"
            >

                🦸 我要幫忙！

            </button>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
