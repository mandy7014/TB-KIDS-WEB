<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>肺肺超人勇闖結核城</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- 首頁 -->

    <main class="home">

        <!-- 標題 -->

        <section class="title-area">

            <p class="small-title">🌈 健康冒險樂園</p>

            <h1>肺肺超人<br>勇闖結核城</h1>

            <p class="subtitle">
                一起認識肺結核，<br>
                守護我們的健康！
            </p>

        </section>


        <!-- 肺肺超人 -->

        <section class="hero">

            <div class="lung-character">
                🫁
            </div>

            <div class="speech">
                嗨！我是肺肺超人！<br>
                歡迎來到我的冒險世界！
            </div>

        </section>


        <!-- 開始按鈕 -->

        <section class="start-area">

            <button class="start-button" onclick="startGame()">
                🚀 開始冒險
            </button>

        </section>


        <!-- 功能按鈕 -->

        <section class="menu">

            <button class="menu-button">
                🏅 我的徽章
            </button>

            <button class="menu-button">
                👨‍👩‍👧 家長專區
            </button>

        </section>


        <!-- 底部 -->

        <footer>

            <p>🌱 肺肺超人健康冒險隊</p>

        </footer>

    </main>


    <script src="js/script.js"></script>
<script src="js/zhuyin-data.js"></script>
<script src="js/zhuyin.js"></script>



</body>

</html>
