<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>肺肺王國冒險地圖</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <main class="map-page">

        <div class="map-card">

            <p class="small-title">
                🌈 肺肺王國冒險地圖
            </p>

            <h1>
                🗺️ 開始你的冒險！
            </h1>

            <p class="map-intro">
                一起完成所有任務，
                成為真正的肺肺守護者！
            </p>


            <!-- 關卡地圖 -->

            <div class="level-map">


                <!-- 第一關 -->

                <a
    href="level1.html"
    class="level level-1 unlocked"
>

    <span class="level-icon">
        🫁
    </span>

    <span class="level-number">
        第一關
    </span>

    <span class="level-title">
        認識肺結核
    </span>

</a>


                <!-- 第二關 -->

               
<a
    id="level2-link"
    class="level level-2 locked"
    href="#"
>
    <span class="level-icon">🦠</span>
    <span class="level-number">第二關</span>
    <span class="level-title">傳染大挑戰</span>
    <span class="lock">🔒</span>
</a>
                   

       
<!-- 第三關 -->

<a
    id="level3-link"
    class="level level-3 locked"
    href="#"
>
    <span class="level-icon">🛡️</span>

    <span class="level-number">
        第三關
    </span>

    <span class="level-title">
        保護自己
    </span>

    <span class="lock">🔒</span>
</a>



                
<!-- 第四關 -->

<a
    id="level4-link"
    class="level level-4 locked"
    href="#"
>
    <span class="level-icon">💊</span>

    <span class="level-number">
        第四關
    </span>

    <span class="level-title">
        吃藥大作戰
    </span>

    <span class="lock">🔒</span>
</a>



               
<!-- 第五關 -->

<a
    id="level5-link"
    class="level level-5 locked"
    href="#"
>
    <span class="level-icon">🏆</span>

    <span class="level-number">
        第五關
    </span>

    <span class="level-title">
        肺肺守護者
    </span>

    <span class="lock">🔒</span>
</a>



            </div>


            <div class="map-footer">

                ⭐ 完成所有關卡，
                就能挑戰最終的結核怪獸！

            </div>

        </div>

    </main>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const level2 = document.getElementById("level2-link");

    const completed =
        localStorage.getItem("level1Completed");

    if (completed === "true") {

        level2.classList.remove("locked");
        level2.classList.add("unlocked");

        level2.querySelector(".lock").textContent = "🔓";

        level2.href = "level2.html";

    } else {

        level2.addEventListener("click", function(event) {
            event.preventDefault();
            alert("🔒 請先完成第一關喔！");
        });

    }

});
</script>

    <script src="js/script.js"></script>

<script src="js/zhuyin.js"></script>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const level3Link =
        document.getElementById("level3-link");

    const level2Completed =
        localStorage.getItem("level2Completed");

    if (!level3Link) return;

    if (level2Completed === "true") {

        level3Link.classList.remove("locked");
        level3Link.classList.add("unlocked");

        level3Link.href = "level3.html";

        level3Link.querySelector(".lock").textContent = "🔓";

    } else {

        level3Link.addEventListener("click", function (event) {
            event.preventDefault();
            alert("🔒 請先完成第二關喔！");
        });

    }

});
</script>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const level4Link =
        document.getElementById("level4-link");

    if (!level4Link) return;

    const level3Completed =
        localStorage.getItem("level3Completed");

    if (level3Completed === "true") {

        level4Link.classList.remove("locked");

    } else {

        level4Link.addEventListener("click", function (event) {
            event.preventDefault();
            alert("🔒 請先完成第三關喔！");
        });

    }

});
</script>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const level5Link =
        document.getElementById("level5-link");

    if (!level5Link) return;

    const level4Completed =
        localStorage.getItem("level4Completed");

    if (level4Completed === "true") {

        level5Link.classList.remove("locked");
        level5Link.classList.add("unlocked");

        level5Link.href = "level5.html";

        level5Link.querySelector(".lock").textContent = "🔓";

    } else {

        level5Link.addEventListener("click", function (event) {
            event.preventDefault();

            alert("🔒 請先完成第四關喔！");
        });

    }

});
</script>


</body>

</html>
